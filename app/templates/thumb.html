<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:D;src:url(data:font/woff2;base64,{{ fonts.display }}) format("woff2");font-weight:200 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{ w }}px;height:{{ h }}px;overflow:hidden;position:relative}
img{display:block;width:100%;height:100%;filter:saturate(.35) contrast(.9)}
.band{position:absolute;left:-20%;right:-20%;top:50%;transform:translateY(-50%) rotate(-14deg);
  background:{{ COLORS[rating] }};color:#fff;display:flex;justify-content:center;align-items:center;gap:.3em;
  padding:.18em 0;font-family:D,serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;
  font-size:{{ (w / 9)|int }}px;box-shadow:0 0 0 .08em #fff}
</style></head>
<body><img src="data:image/jpeg;base64,{{ img }}" alt=""><div class="band">{{ icon(rating, (w / 10)|int) }}{{ RATINGS[rating] }}</div>
<script>document.fonts.ready.then(() => document.body.dataset.ready = 1)</script></body></html>
