# Owners: two outlets from the same group do NOT count as independent sources, and when more than half
# of a claim's sources belong to one group the rating is capped.
# A domain not listed here counts as its own group.
# Keep this list up to date: media ownership changes. Last reviewed: 2026-09.
owner_groups:
  Grupo Valorem (Santo Domingo): [elespectador.com, bluradio.com, noticiascaracol.com, caracoltv.com]
  Organización Ardila Lülle: [noticiasrcn.com, rcnradio.com, lafm.com.co, ntn24.com, canalrcn.com]
  Casa Editorial El Tiempo (Sarmiento Angulo): [eltiempo.com, portafolio.co, citytv.eltiempo.com]
  Grupo Gilinski: [semana.com]
  PRISA: [caracol.com.co, wradio.com.co, elpais.com]
  Gobierno nacional de Colombia (Ejecutivo): [presidencia.gov.co, minsalud.gov.co, mindefensa.gov.co, fac.mil.co, ejercito.mil.co, policia.gov.co, rtvcnoticias.com]
  Agencia EFE (Estado español): [efe.com]
  AFP: [afp.com, factual.afp.com]
  # To confirm (owners that changed or are unclear; fill them in if you know them):
  # El Colombiano, El País (Cali), El Heraldo, Cambio, Publimetro.

# Never count as evidence: social networks and forums.
# Tertiary sources: anyone can edit them, or a machine writes them. They never count as evidence, but the
# references they cite are followed to reach the original sources.
leads_only:
  - wikipedia.org
  - wikiwand.com
  - grokipedia.com
  - everipedia.org
  - fandom.com
  - infogalactic.com

