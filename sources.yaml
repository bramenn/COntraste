# Source trust tiers. Edit this file and restart the container.
# Matching is by domain: "afp.com" also covers "www.afp.com"; when two entries match, the most specific wins
# (that is why factual.afp.com is tier 2 even though afp.com is tier 3).
# Any domain not listed here is tier 4 (weighs less). Search covers the whole world.

