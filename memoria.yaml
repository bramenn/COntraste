    source: {name: Parques Nacionales, url: "https://www.parquesnacionales.gov.co/sala-prensa/noticias/colombia-registro-1-560-especies-de-aves-y-confirmo-su-liderazgo-mundial-en-avistamiento-de-aves-durante-el-global-big-day-2025/"}

