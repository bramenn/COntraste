# «Memoria»: Colombian history in verified facts (page /memoria and the footer).
# Every fact links to a source that states it, and `verify` lists the words that page must contain
# (dates, names, numbers). Re-check them all with:  python -m app.memoria
# Rules: official, institutional or tier 1-3 outlets only; never an encyclopedia; say only what the source says.
checked: "2026-10-02"

stats:
