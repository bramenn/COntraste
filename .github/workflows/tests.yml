name: Pruebas
on:
  push: {branches: [master]}
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: contraste, POSTGRES_PASSWORD: ci, POSTGRES_DB: contraste}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U contraste" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://contraste:ci@localhost:5432/contraste_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps --only-shell chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/similar.py') }}
      - run: python -m pytest -q
