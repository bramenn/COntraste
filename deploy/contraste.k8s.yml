# Contraste in the contabo-k3s cluster, namespace "contraste".
# Secrets (contraste-env, pgbouncer-userlist, postgres-admin, ghcr-pull) are created out of band, never committed.
# Data lives in the namespace's own PostgreSQL (deploy/postgres.k8s.yml); the app talks to it through pgbouncer.
# /data is unused in the cluster (media lives in the database), so there is no PVC and any pod can run
# on any node. The HPA scales the app between 3 and 11 replicas on CPU; the job queue is claimed with
# FOR UPDATE SKIP LOCKED and each replica heartbeats its running jobs, so replicas never race.
# The ingress has no TLS: the node in front (cloudflared) terminates TLS for contraste.bramen.org.
apiVersion: v1
kind: Namespace
metadata:
  name: contraste
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: contraste
data:
  pgbouncer.ini: |
    [databases]
    contraste = host=postgres port=5432 dbname=contraste

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    default_pool_size = 20
    reserve_pool_size = 5
    max_client_conn = 500
    server_tls_sslmode = disable
    ignore_startup_parameters = extra_float_digits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: contraste
  labels: {app: contraste, component: pgbouncer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: contraste, component: pgbouncer}
  template:
    metadata:
      labels: {app: contraste, component: pgbouncer}
    spec:
      # mumen-rider leaves the cluster: nothing of Contraste is ever scheduled there.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [mumen-rider]}
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:v1.25.2-p0
        ports: [{containerPort: 6432, name: pgbouncer}]
        readinessProbe: &pgprobe
          tcpSocket: {port: pgbouncer}
          periodSeconds: 5
        livenessProbe:
          <<: *pgprobe
          periodSeconds: 20
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/pgbouncer/pgbouncer.ini, subPath: pgbouncer.ini}
        - {name: userlist, mountPath: /etc/pgbouncer/userlist.txt, subPath: userlist.txt}
      volumes:
      - name: config
        configMap: {name: pgbouncer-config}
      - name: userlist
        secret: {secretName: pgbouncer-userlist}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: contraste
spec:
  selector: {app: contraste, component: pgbouncer}
  ports: [{port: 6432, targetPort: 6432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: contraste
  labels: {app: contraste, component: app}
spec:
  # The HPA owns the replica count; rollouts keep at least the current capacity.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 2}
  selector:
    matchLabels: {app: contraste, component: app}
  template:
    metadata:
      labels: {app: contraste, component: app}
    spec:
      # mumen-rider leaves the cluster: nothing of Contraste is ever scheduled there.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [mumen-rider]}
      imagePullSecrets: [{name: ghcr-pull}]
      # Running checks get time to finish on shutdown; anything left is re-queued by another replica.
      terminationGracePeriodSeconds: 180
      containers:
      - name: app
        image: ghcr.io/bramenn/contraste:latest
        imagePullPolicy: Always
        ports: [{containerPort: 8080}]
        envFrom:
        - secretRef: {name: contraste-env}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: "/healthz?live=1", port: 8080}
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 4
        resources:
          requests: {cpu: 250m, memory: 1500Mi}
          limits: {cpu: 2, memory: 4Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: contraste
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 3
  maxReplicas: 11
  # A starting pod spikes CPU (model loading): scale up only on load sustained for 2 minutes.
  behavior:
    scaleUp: {stabilizationWindowSeconds: 120}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: contraste
spec:
  selector: {app: contraste, component: app}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contraste
  namespace: contraste
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    # Checks stream progress over SSE, so responses stay open for minutes.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
  - host: contraste.bramen.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app
            port: {number: 8080}
